# ==============================================================================
# Factory Memory - Declarative Agent Registry & Multi-Agent Configuration
# ==============================================================================

system:
  safety_max_revision_loops: 2
  confidence_threshold_review: 0.75
  # A3 semantic near-duplicate warning (symptom cosine, same machine label). Uncalibrated.
  duplicate_similarity_threshold: 0.90
  abstention_similarity_threshold: 0.55
  log_path: "logs/audit_trace.jsonl"

conflict_ranking_weights:
  outcome_worked: 0.40
  outcome_failed: -0.50
  verified_by_senior: 0.25
  recency_decay: 0.15
  vector_similarity: 0.20

# Active Pipeline Configurations
pipelines:
  # Pipeline B: Assistance & Troubleshooting Workflow
  B:
    name: "Assistance Pipeline"
    entrypoint: "DiagnosticAgent"
    agents:
      - name: "DiagnosticAgent"
        role: "Fault interpretation & hypothesis ranking"
        pipeline: "B"
        module: "project.agents.a5_diagnostic"
        class: "DiagnosticAgent"
        enabled: true
        stub: false
        order: 1

      - name: "DummyOrchestratorAgent"
        role: "Draft repair step retrieval and synthesis (STUB)"
        pipeline: "B"
        module: "project.core.stubs.dummy_agents"
        class: "DummyOrchestratorAgent"
        enabled: true
        stub: true
        order: 2

      - name: "SafetyAgent"
        role: "Deterministic safety rule verification and LLM oversight"
        pipeline: "B"
        module: "project.agents.a7_safety"
        class: "SafetyAgent"
        enabled: true
        stub: false
        order: 3

    # Graph edge definitions (src -> dst). Use '__end__' to terminate.
    # Conditional routing: specify condition: "check_clarification", on_true, on_false
    edges:
      - from: "DiagnosticAgent"
        condition: "check_clarification"
        on_true: "__end__"
        on_false: "DummyOrchestratorAgent"
      - from: "DummyOrchestratorAgent"
        to: "SafetyAgent"
      - from: "SafetyAgent"
        to: "__end__"

  # Pipeline A: capture -> unverified draft -> A3 validation into the human review queue.
  # Only ReviewQueue.approve() publishes verified episodes; A4 (K5) follows later.
  A:
    name: "Ingestion Pipeline"
    entrypoint: "CaptureAgent"
    agents:
      - name: "CaptureAgent"
        module: "project.agents.a1_capture"
        class: "CaptureAgent"
        enabled: true
        stub: false
      - name: "ExtractionAgent"
        module: "project.agents.a2_extraction"
        class: "ExtractionAgent"
        enabled: true
        stub: false
      - name: "ValidationAgent"
        module: "project.agents.a3_validation"
        class: "ValidationAgent"
        enabled: true
        stub: false
    edges:
      - from: "CaptureAgent"
        to: "ExtractionAgent"
      - from: "ExtractionAgent"
        to: "ValidationAgent"
      - from: "ValidationAgent"
        to: "__end__"
